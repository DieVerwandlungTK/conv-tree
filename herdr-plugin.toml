id = "conv-tree"
name = "conv-tree"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Show Claude Code conversations as a tree; fork / merge into new panes"
platforms = ["linux"]

[[panes]]
id = "tree"
title = "conv-tree"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/conv-tree-pane\""]

[[actions]]
id = "open"
title = "Open conversation tree"
contexts = ["workspace"]
command = ["bin/conv-tree-open"]
