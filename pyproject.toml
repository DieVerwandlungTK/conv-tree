[project]
name = "conv-tree"
version = "0.1.0"
description = "Claude Code conversation tree for herdr"
requires-python = ">=3.12"
dependencies = ["textual>=0.80"]

[project.scripts]
conv-tree = "conv_tree.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conv_tree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
